# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Anexo que o usuário arrastou para a anotação e não salvou fica no disco sem dono. A
  # margem de uma hora existe para não apagar o anexo de quem ainda está escrevendo: entre o
  # upload e o salvamento, o blob é legitimamente órfão.
  purge_unattached_note_blobs:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..1.hour.ago).find_each(&:purge_later)"
    schedule: every day at 4am
