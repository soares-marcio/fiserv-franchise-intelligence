pt-BR:
  # Mensagens de validação do Active Record. O projeto não usa a gem rails-i18n: aqui só
  # entram as chaves que as telas realmente mostram — sem elas, o formulário exibe
  # "Translation missing" no lugar do erro.
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "é obrigatório"
      taken: "já está em uso"
      invalid: "não é válido"
      confirmation: "não confere"
      too_short: "precisa de ao menos %{count} caracteres"
      too_long: "passa de %{count} caracteres"
  activerecord:
    errors:
      messages:
        # Mensagem do RecordInvalid, que é o que save!/update! levantam: sem esta chave o
        # erro chegava como "Translation missing" no seed e nos rescues dos controllers.
        record_invalid: "Registro inválido: %{errors}"
    attributes:
      user:
        email_address: "E-mail"
        name: "Nome"
        password: "Senha"
        password_confirmation: "Confirmação da senha"
        permissions: "Permissões"
      access_grant:
        channel: "Master"
        sub_channel: "MIC"
  number:
    currency:
      format:
        unit: "R$"
        separator: ","
        delimiter: "."
        format: "%u %n"
        precision: 2
    percentage:
      format:
        delimiter: "."
        separator: ","
        format: "%n%"
  # Sem isto, to_sentence liga a última palavra com "and" — o erro apareceu na mensagem de
  # erro do import e de novo na lista de campos divergentes da ficha.
  support:
    array:
      words_connector: ", "
      two_words_connector: " e "
      last_word_connector: " e "
  date:
    formats:
      default: "%d/%m/%Y"
    day_names:
      - domingo
      - segunda-feira
      - terça-feira
      - quarta-feira
      - quinta-feira
      - sexta-feira
      - sábado
    abbr_day_names:
      - dom
      - seg
      - ter
      - qua
      - qui
      - sex
      - sáb
    abbr_month_names:
      - ~
      - jan
      - fev
      - mar
      - abr
      - mai
      - jun
      - jul
      - ago
      - set
      - out
      - nov
      - dez
    month_names:
      - ~
      - janeiro
      - fevereiro
      - março
      - abril
      - maio
      - junho
      - julho
      - agosto
      - setembro
      - outubro
      - novembro
      - dezembro
