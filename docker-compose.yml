# Nome fixo do projeto: os volumes existentes são fiserv-franchise-intelligence_*.
# Sem isto o compose derivaria o nome da pasta e subiria uma stack vazia.
name: fiserv-franchise-intelligence

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fiserv_franchise_intelligence_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Superusuário com senha padrão: só o host enxerga a porta. O app fala com o db pela rede
    # interna do Compose, e o bin/setup no host continua entrando por 127.0.0.1.
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fiserv_franchise_intelligence_development']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: bin/rails server -b 0.0.0.0
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      CACHE_DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      CABLE_DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:?defina METABASE_RO_PASSWORD no .env}
      QUEUE_DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METABASE_URL: ${METABASE_URL:-http://localhost:3001}
      RAILS_HOSTS: ${RAILS_HOSTS:-}
    # O Caddy que serve fiserv.bin roda em outra máquina da LAN e faz proxy para este IP,
    # então a porta precisa ficar no endereço da rede — não em 127.0.0.1 nem em 0.0.0.0.
    ports:
      - '${APP_BIND_IP:-127.0.0.1}:3000:3000'
    restart: unless-stopped
    volumes:
      - storage:/rails/storage
    # O db:prepare roda no entrypoint, antes do Puma escutar. Logo, /up respondendo significa
    # schema no lugar — é disso que o worker depende para não subir num banco vazio.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/up > /dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: bin/jobs
    # O db:rebuild derruba o banco por instantes, e nessa janela o bin/jobs encerra com
    # ActiveRecord::NoDatabaseError — o supervisor do Solid Queue reergue os filhos dele, não
    # a si mesmo. Sem política de restart o container ficava Exited e as filas paravam caladas.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      CACHE_DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      CABLE_DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:?defina METABASE_RO_PASSWORD no .env}
      QUEUE_DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    volumes:
      - storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
  test:
    profiles: [test]
    build:
      context: .
      target: test
    # test:all inclui os testes de sistema (test/system), que o `rails test` puro não roda.
    command: bin/rails db:test:prepare test:all
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fiserv_franchise_intelligence_test
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:?defina METABASE_RO_PASSWORD no .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?defina SECRET_KEY_BASE no .env}
    volumes:
      - test_storage:/rails/tmp/storage
    depends_on:
      db:
        condition: service_healthy
  metabase:
    # Versão fixa: `latest` trocaria o Metabase por baixo do banco H2 sem ninguém pedir.
    image: metabase/metabase:v0.63.15.5
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - '${APP_BIND_IP:-127.0.0.1}:3001:3000'
    restart: unless-stopped
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  metabase_data:
  storage:
  test_storage:
