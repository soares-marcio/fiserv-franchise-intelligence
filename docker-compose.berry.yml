# Sobreposição para o berry (Raspberry Pi, Docker rootless), onde o portal roda desde
# 09/2026. Ativada pelo .env de lá — COMPOSE_FILE=docker-compose.yml:docker-compose.berry.yml —,
# então `docker compose` e `bin/db-backup` a leem sem argumento. O docker-compose.yml fica
# intacto para o desenvolvimento no Mac.
#
# Nenhuma porta no host: o Caddy que serve fiserv.bin roda na mesma máquina, dentro do
# projeto fiserv-proxy, e alcança o web pela rede dele (fiserv-proxy_default) pelo alias —
# o mesmo desenho do lottery-app, que divide o berry com o portal. O Postgres deixa de ser
# alcançável fora do Compose; backup e restore entram por `docker compose exec`.
#
# O Metabase fica fora desta versão por decisão de 18/09/2026: atrás de profile, o
# `docker compose up -d` não o sobe nem cria o volume. Ligar é
# `docker compose --profile metabase up -d metabase` — ver "Build futuro: Metabase" no README.
services:
  db:
    ports: !reset []
  web:
    ports: !reset []
    # O docker-compose.yml dá um padrão a METABASE_URL (localhost:3001), e com ele o app via a
    # variável definida: o aviso "desligado" de /metabase nunca aparecia (18/09/2026). Aqui ela
    # fica vazia até o .env defini-la (build futuro: METABASE_URL=http://fiserv-metabase.bin).
    environment:
      METABASE_URL: ${METABASE_URL:-}
      RAILS_LOG_FILE: web.log
    # O log também vai para ./log do clone, que sobrevive ao deploy (o do Docker morre com o
    # container). Um arquivo por serviço: os dois girando o mesmo seria corrida à toa. A pasta
    # precisa pertencer ao uid 1000 do container — ver README, "Log em arquivo no berry".
    volumes:
      - ./log:/rails/log
    networks:
      default: {}
      proxy:
        aliases:
          - fiserv-web
  worker:
    environment:
      RAILS_LOG_FILE: worker.log
    # Também é o worker que apaga o girado com mais de 30 dias (config/recurring.yml).
    volumes:
      - ./log:/rails/log
  metabase:
    profiles: [metabase]
    ports: !reset []
    networks:
      default: {}
      proxy:
        aliases:
          - fiserv-metabase

networks:
  proxy:
    external: true
    name: fiserv-proxy_default
